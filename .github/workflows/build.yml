name: Build

on:
  push:
    branches: [BeiDou, master, robot]
    tags: ['v*']
  pull_request:
    branches: [BeiDou, master, robot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      # 项目使用 v142 (VS2019) 工具集；runner 上若没装 v142 则回退到 VS2022 自带的 v143
      - name: Select platform toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $v142 = Join-Path $vs 'MSBuild\Microsoft\VC\v170\Platforms\Win32\PlatformToolsets\v142'
          if (Test-Path $v142) { $toolset = 'v142' } else { $toolset = 'v143' }
          Write-Host "Using toolset: $toolset"
          "TOOLSET=$toolset" >> $env:GITHUB_ENV

      - name: Build Release x86
        run: msbuild ezorsia.sln /m /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=${{ env.TOOLSET }}

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\Release\ijl15.dll dist\
          Copy-Item out\Release\ijl15.pdb dist\ -ErrorAction SilentlyContinue
          Copy-Item ezorsia\config.ini dist\

      - uses: actions/upload-artifact@v7
        with:
          name: ijl15-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ijl15-${{ github.sha }}
          path: dist

      - name: Package
        run: cd dist && zip -r ../ijl15-${{ github.ref_name }}.zip ijl15.dll config.ini

      - uses: softprops/action-gh-release@v3
        with:
          files: ijl15-${{ github.ref_name }}.zip
          generate_release_notes: true
